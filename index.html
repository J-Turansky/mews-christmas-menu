<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d5a3c">
<title>Mews Christmas Menu 2026 – results</title>
<style>
  :root {
    --bg: #f4efe6; --card: #fffdf9; --ink: #1f2a24; --muted: #66706a; --line: #e4dccd;
    --accent: #8c1c24; --accent-2: #1d5a3c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  header { background: var(--accent-2); color: #fff; padding: 28px 20px 24px; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
  header .wrap { padding: 0; display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; }
  h1 { margin: 0 0 4px; font-size: clamp(22px, 4vw, 30px); font-weight: 650; letter-spacing: -.01em; }
  .meta { opacity: .85; font-size: 14px; }
  .meta b { font-weight: 600; }
  .info-btn { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.7); background: transparent; color: #fff; font: italic 600 17px Georgia, serif; cursor: pointer; }
  .info-btn:hover, .info-btn:focus-visible { background: rgba(255,255,255,.15); outline: none; }
  main { padding: 24px 0 40px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 480px), 1fr)); gap: 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px 20px; }
  .card h2 { margin: 0 0 2px; font-size: 16px; font-weight: 600; }
  .card .sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .chart { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  .chart svg.pie { width: 170px; height: 170px; flex: none; }
  .legend { list-style: none; margin: 0; padding: 0; flex: 1; min-width: 180px; font-size: 14px; }
  .legend li { display: grid; grid-template-columns: 12px 1fr auto; gap: 8px; align-items: baseline; padding: 3px 0; }
  .legend .sw { width: 12px; height: 12px; border-radius: 50%; transform: translateY(1px); }
  .legend .n { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .legend li.zero { color: var(--muted); }
  .bars { width: 100%; display: grid; gap: 8px; font-size: 14px; }
  .bar-row { display: grid; grid-template-columns: minmax(90px, 38%) 1fr auto; gap: 10px; align-items: center; }
  .bar-track { background: #efe9dd; border-radius: 4px; height: 14px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; }
  .empty { background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 40px 20px; text-align: center; color: var(--muted); }
  footer { color: var(--muted); font-size: 13px; text-align: center; padding: 0 20px 30px; }
  .ver { font-variant-numeric: tabular-nums; }

  dialog { border: none; border-radius: 14px; padding: 0; width: min(920px, 94vw); height: min(760px, 88vh); box-shadow: 0 20px 60px rgba(0,0,0,.25); color: var(--ink); }
  dialog::backdrop { background: rgba(20, 30, 25, .45); }
  .dlg { display: flex; flex-direction: column; height: 100%; }
  .dlg-head { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--line); padding: 10px 12px 0; flex: none; }
  .tab { border: none; background: none; padding: 10px 14px; font: inherit; font-weight: 550; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
  .tab[aria-selected="true"] { color: var(--accent-2); border-bottom-color: var(--accent-2); }
  .close { margin-left: auto; border: none; background: none; font-size: 22px; line-height: 1; padding: 6px 10px; cursor: pointer; color: var(--muted); }
  .dlg-body { overflow: auto; padding: 18px 24px 24px; flex: 1; }
  .dlg-body h3 { margin: 18px 0 6px; font-size: 15px; }
  .dlg-body h3:first-child { margin-top: 0; }
  .dlg-body p, .dlg-body li { max-width: 72ch; }
  .changelog .entry { padding-bottom: 12px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
  .changelog .entry:last-child { border-bottom: none; }

  /* Mobile first: most visitors open this on a phone */
  @media (max-width: 600px) {
    body { font-size: 16px; }
    header { padding: calc(18px + env(safe-area-inset-top)) 16px 16px; position: sticky; top: 0; z-index: 5; }
    h1 { font-size: 21px; line-height: 1.25; }
    .meta { font-size: 13.5px; }
    .info-btn { width: 40px; height: 40px; }
    .wrap { padding: 0 12px; }
    main { padding: 12px 0 24px; }
    .grid { gap: 12px; }
    .card { padding: 16px; border-radius: 14px; }
    .card h2 { font-size: 17px; line-height: 1.3; }
    .chart { flex-direction: column; align-items: stretch; gap: 14px; }
    .chart svg.pie { width: min(220px, 62vw); height: auto; aspect-ratio: 1; align-self: center; }
    .legend { min-width: 0; font-size: 15px; }
    .legend li { padding: 6px 0; border-top: 1px solid #f0ebe1; }
    .legend li:first-child { border-top: none; }
    .bar-row { grid-template-columns: 1fr auto; row-gap: 4px; }
    .bar-row .bar-track { grid-column: 1 / -1; grid-row: 2; height: 12px; }
    footer { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
    dialog { width: 100vw; height: 100dvh; max-width: 100vw; max-height: 100dvh; margin: 0; border-radius: 0; }
    .dlg-head { padding: calc(6px + env(safe-area-inset-top)) 4px 0; overflow-x: auto; }
    .tab { padding: 12px 10px; white-space: nowrap; font-size: 15px; }
    .close { font-size: 28px; padding: 6px 12px; }
    .dlg-body { padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
    .arch { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
    .arch svg { min-width: 680px; }
  }
  .changelog .entry b { display: block; }
  .arch svg { width: 100%; max-width: 820px; height: auto; display: block; margin: 6px 0 14px; }
  code { background: #f1ece2; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div>
      <h1 id="title">Mews Christmas Menu 2026</h1>
      <div class="meta" id="meta">Loading results…</div>
    </div>
    <button class="info-btn" id="infoBtn" aria-label="About this page" title="About this page">i</button>
  </div>
</header>

<main class="wrap">
  <div id="charts" class="grid" aria-live="polite"></div>
</main>

<footer>Totals refresh automatically every 6 hours · <span class="ver" id="ver"></span></footer>

<dialog id="info" aria-label="About this page">
  <div class="dlg">
    <div class="dlg-head" role="tablist">
      <button class="tab" role="tab" data-tab="how" aria-selected="true">How to use</button>
      <button class="tab" role="tab" data-tab="new" aria-selected="false">What's new</button>
      <button class="tab" role="tab" data-tab="arch" aria-selected="false">Architecture</button>
      <button class="close" id="closeInfo" aria-label="Close">×</button>
    </div>
    <div class="dlg-body" id="dlgBody"></div>
  </div>
</dialog>

<script>
const VERSION = '1.0.0';
const CHANGELOG = [
  { version: '1.0.0', date: '02/10/2026', notes: [
    'First release: pie charts for every choice question on the Mews Christmas Menu 2026 form.',
    'A Google Apps Script refreshes the totals every 6 hours and commits them to this site.',
    'Built for phones: charts stack above their legends, the header stays in view and the info dialog opens full screen.',
    'Checkbox questions show as bars, because one person can pick several answers.',
    'Only totals are published. Names, free text and "Other" write-ins stay in Google.'
  ]}
];
const COLORS = ['#3366cc','#dc3912','#ff9900','#109618','#990099','#0099c6','#dd4477','#66aa00','#b82e2e','#316395','#994499','#22aa99','#aaaa11','#6633cc','#e67300'];

const $ = id => document.getElementById(id);
$('ver').textContent = 'v' + VERSION;

function fmtDate(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function el(tag, attrs = {}, text) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  return e;
}
const SVG = 'http://www.w3.org/2000/svg';
function sv(tag, attrs) {
  const e = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}

function pie(counts) {
  const total = counts.reduce((s, c) => s + c.count, 0);
  const svg = sv('svg', { viewBox: '-1.05 -1.05 2.1 2.1', class: 'pie', role: 'img' });
  if (!total) {
    svg.append(sv('circle', { r: 1, fill: '#ece5d8' }));
    return svg;
  }
  let a = -Math.PI / 2;
  counts.forEach((c, i) => {
    if (!c.count) return;
    const frac = c.count / total;
    const fill = COLORS[i % COLORS.length];
    if (frac >= 0.9999) {
      svg.append(sv('circle', { r: 1, fill }));
    } else {
      const a2 = a + frac * 2 * Math.PI;
      const large = frac > 0.5 ? 1 : 0;
      const d = `M0 0 L${Math.cos(a)} ${Math.sin(a)} A1 1 0 ${large} 1 ${Math.cos(a2)} ${Math.sin(a2)} Z`;
      svg.append(sv('path', { d, fill, stroke: '#fff', 'stroke-width': 0.012 }));
    }
    if (frac >= 0.06) {
      const mid = a + frac * Math.PI;
      const t = sv('text', { x: Math.cos(mid) * 0.62, y: Math.sin(mid) * 0.62 + 0.045, 'text-anchor': 'middle', 'font-size': 0.13, fill: '#fff', 'font-weight': 600 });
      t.textContent = Math.round(frac * 1000) / 10 + '%';
      svg.append(t);
    }
    a += frac * 2 * Math.PI;
  });
  svg.setAttribute('aria-label', counts.map(c => `${c.label}: ${c.count}`).join(', '));
  return svg;
}

function legend(counts) {
  const total = counts.reduce((s, c) => s + c.count, 0);
  const ul = el('ul', { class: 'legend' });
  counts.forEach((c, i) => {
    const li = el('li', c.count ? {} : { class: 'zero' });
    const sw = el('span', { class: 'sw' });
    sw.style.background = COLORS[i % COLORS.length];
    const pct = total ? ` (${Math.round(c.count / total * 1000) / 10}%)` : '';
    li.append(sw, el('span', {}, c.label), el('span', { class: 'n' }, c.count + pct));
    ul.append(li);
  });
  return ul;
}

function bars(counts, answered) {
  const wrap = el('div', { class: 'bars' });
  const max = Math.max(1, ...counts.map(c => c.count));
  counts.forEach((c, i) => {
    const row = el('div', { class: 'bar-row' });
    const track = el('div', { class: 'bar-track' });
    const fill = el('div', { class: 'bar-fill' });
    fill.style.width = (c.count / max * 100) + '%';
    fill.style.background = COLORS[i % COLORS.length];
    track.append(fill);
    const pct = answered ? ` (${Math.round(c.count / answered * 1000) / 10}%)` : '';
    row.append(el('span', {}, c.label), track, el('span', { class: 'legend n' }, c.count + pct));
    wrap.append(row);
  });
  return wrap;
}

function render(data) {
  document.title = (data.title || 'Form') + ' – results';
  $('title').textContent = data.title || 'Mews Christmas Menu 2026';
  const meta = $('meta');
  meta.textContent = '';
  if (data.updated) {
    meta.append(el('b', {}, String(data.totalResponses ?? 0)), ` response${data.totalResponses === 1 ? '' : 's'} · updated ${fmtDate(data.updated)}`);
    if (data.acceptingResponses === false) meta.append(' · form closed');
  } else {
    meta.textContent = 'Waiting for the first sync from Google Forms.';
  }

  const host = $('charts');
  host.textContent = '';
  const qs = data.questions || [];
  if (!qs.length) {
    host.className = '';
    host.append(el('div', { class: 'empty' }, data.updated ? 'This form has no choice questions to chart.' : 'No results yet. They appear here after the first sync.'));
    return;
  }
  host.className = 'grid';
  qs.forEach(q => {
    const card = el('section', { class: 'card' });
    card.append(el('h2', {}, q.title));
    const n = q.answered ?? 0;
    card.append(el('div', { class: 'sub' }, `${n} response${n === 1 ? '' : 's'}${q.kind === 'bar' ? ' · pick any that apply' : ''}`));
    const chart = el('div', { class: 'chart' });
    if (q.kind === 'bar') chart.append(bars(q.counts, n));
    else chart.append(pie(q.counts), legend(q.counts));
    card.append(chart);
    host.append(card);
  });
}

async function load() {
  try {
    const r = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
  } catch (e) {
    $('meta').textContent = 'Could not load the results. Try refreshing in a minute.';
  }
}
load();
setInterval(load, 30 * 60 * 1000);

// Info dialog
const PAGES = {
  how: () => `
    <h3>About</h3>
    <p>Live totals for the <b>Mews Christmas Menu 2026</b> Google Form, drawn the same way as the charts on the form's Responses tab. Totals refresh every 6 hours.</p>
    <h3>How to use</h3>
    <ul>
      <li>Each card is one question. The pie shows how the answers split; the list beside it gives the count and percentage for every option, including options nobody has picked yet.</li>
      <li>Questions where people can tick several boxes show as bars. Their percentages are of the people who answered, so they can add up to more than 100%.</li>
      <li>The header shows the total number of responses and when the totals were last refreshed. Leave the page open and it reloads by itself every 30 minutes.</li>
      <li>Only totals are shown. Names, free-text answers and "Other" write-ins are never published; write-ins count under <i>Other</i>.</li>
    </ul>
    <h3>Owner notes</h3>
    <ul>
      <li>To refresh now, open the Apps Script project and run <code>sync</code>.</li>
      <li>If the totals stop updating, check the script's <b>Executions</b> page. The usual cause is an expired GitHub token; replace the <code>GITHUB_TOKEN</code> script property.</li>
    </ul>`,
  new: () => '<div class="changelog">' + CHANGELOG.map(c =>
    `<div class="entry"><b>v${c.version} · ${c.date}</b><ul>${c.notes.map(n => `<li>${n}</li>`).join('')}</ul></div>`).join('') + '</div>',
  arch: () => `
    <div class="arch">
    <svg viewBox="0 0 820 230" font-family="Segoe UI, system-ui, sans-serif" font-size="13">
      <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#66706a"/></marker></defs>
      <rect x="10" y="20" width="170" height="70" rx="10" fill="#e8f0fe" stroke="#3366cc"/>
      <text x="95" y="50" text-anchor="middle" font-weight="600">Google Form</text>
      <text x="95" y="70" text-anchor="middle" fill="#66706a">responses</text>
      <rect x="230" y="20" width="190" height="70" rx="10" fill="#fff4e0" stroke="#ff9900"/>
      <text x="325" y="45" text-anchor="middle" font-weight="600">Apps Script (Code.gs)</text>
      <text x="325" y="64" text-anchor="middle" fill="#66706a">runs as your Google account</text>
      <text x="325" y="80" text-anchor="middle" fill="#66706a">every 6 hours</text>
      <rect x="470" y="20" width="160" height="70" rx="10" fill="#eef7ee" stroke="#109618"/>
      <text x="550" y="45" text-anchor="middle" font-weight="600">GitHub repo</text>
      <text x="550" y="64" text-anchor="middle" fill="#66706a">data.json (totals)</text>
      <text x="550" y="80" text-anchor="middle" fill="#66706a">+ index.html</text>
      <rect x="670" y="20" width="140" height="70" rx="10" fill="#f6eaea" stroke="#8c1c24"/>
      <text x="740" y="50" text-anchor="middle" font-weight="600">GitHub Pages</text>
      <text x="740" y="70" text-anchor="middle" fill="#66706a">this page</text>
      <line x1="180" y1="55" x2="228" y2="55" stroke="#66706a" marker-end="url(#ah)"/>
      <line x1="420" y1="55" x2="468" y2="55" stroke="#66706a" marker-end="url(#ah)"/>
      <line x1="630" y1="55" x2="668" y2="55" stroke="#66706a" marker-end="url(#ah)"/>
      <text x="204" y="45" text-anchor="middle" font-size="11" fill="#66706a">FormApp</text>
      <text x="444" y="45" text-anchor="middle" font-size="11" fill="#66706a">REST PUT</text>
      <rect x="230" y="130" width="190" height="60" rx="10" fill="#fff" stroke="#e4dccd" stroke-dasharray="4 3"/>
      <text x="325" y="155" text-anchor="middle" font-weight="600">Script properties</text>
      <text x="325" y="174" text-anchor="middle" fill="#66706a">GITHUB_TOKEN (fine-grained)</text>
      <line x1="325" y1="130" x2="325" y2="92" stroke="#66706a" stroke-dasharray="3 3" marker-end="url(#ah)"/>
      <rect x="670" y="130" width="140" height="60" rx="10" fill="#fff" stroke="#e4dccd"/>
      <text x="740" y="155" text-anchor="middle" font-weight="600">Browser</text>
      <text x="740" y="174" text-anchor="middle" fill="#66706a">SVG charts</text>
      <line x1="740" y1="92" x2="740" y2="128" stroke="#66706a" marker-end="url(#ah)"/>
    </svg>
    </div>
    <h3>Data flow</h3>
    <ul>
      <li><b>Collect:</b> <code>apps-script/Code.gs</code> runs on Google's servers under the form owner's account. A time trigger calls <code>sync()</code> every 6 hours. It reads the form with <code>FormApp</code> and counts answers for multiple choice, dropdown, checkbox and linear-scale questions.</li>
      <li><b>Publish:</b> the script writes <code>data.json</code> to <code>J-Turansky/mews-christmas-menu</code> through the GitHub contents API, using a fine-grained token stored in Script properties that can only write to this repo.</li>
      <li><b>Display:</b> GitHub Pages serves <code>index.html</code>, which fetches <code>data.json</code> and draws the charts as inline SVG with no external libraries. The colours match Google Forms.</li>
    </ul>
    <h3>Privacy</h3>
    <p>The page is public. Only per-option counts leave Google. Text, paragraph, date and grid questions are skipped, and "Other" write-ins count as <i>Other</i>.</p>
    <h3>data.json shape</h3>
    <p><code>{ title, updated, totalResponses, acceptingResponses, questions: [ { title, kind: "pie"|"bar", answered, counts: [ { label, count } ] } ] }</code></p>`
};
const dlg = $('info');
function showTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === name)));
  $('dlgBody').innerHTML = PAGES[name]();
  $('dlgBody').scrollTop = 0;
}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => showTab(t.dataset.tab)));
$('infoBtn').addEventListener('click', () => { showTab('how'); dlg.showModal(); });
$('closeInfo').addEventListener('click', () => dlg.close());
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
</script>
</body>
</html>
